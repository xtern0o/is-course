spring.application.name=trace
server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://localhost:55432/trace
spring.datasource.username=trace
spring.datasource.password=trace-local
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.security.oauth2.client.registration.trace.provider=keycloak
spring.security.oauth2.client.registration.trace.client-id=trace-web
spring.security.oauth2.client.registration.trace.client-secret=local-trace-secret
spring.security.oauth2.client.registration.trace.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/trace
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
