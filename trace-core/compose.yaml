services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: trace
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace-local
    ports: [ "127.0.0.1:55432:5432" ]
    volumes: [ "trace-postgres:/var/lib/postgresql" ]
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: [ "start-dev", "--import-realm" ]
    ports: [ "127.0.0.1:8180:8080" ]
    volumes:
      - trace-keycloak:/opt/keycloak/data
      - ./infra/trace-realm.json:/opt/keycloak/data/import/trace-realm.json:ro
      - ./infra/theme/trace:/opt/keycloak/themes/trace:ro
volumes:
  trace-postgres:
  trace-keycloak:
